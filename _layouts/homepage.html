<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title | escape }} | CUHK-Shenzhen</title>
    <meta name="description" content="{{ site.description | escape }}">
    <link rel="canonical" href="{{ '/' | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ site.title | escape }}">
    <meta property="og:description" content="{{ site.description | escape }}">
    <meta property="og:url" content="{{ '/' | absolute_url }}">
    <meta property="og:image" content="{{ site.avatar | absolute_url }}">
    <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="wrapper">
      <header class="profile">
        <a class="portrait-link" href="{{ '/' | relative_url }}" aria-label="Xiaoxiao Tu home">
          <img class="portrait" src="{{ site.avatar | relative_url }}" width="176" height="176" alt="Xiaoxiao Tu in front of a waterfall">
        </a>
        <h1>{{ site.title }}</h1>
        <p class="affiliation">{{ site.affiliation }}</p>
        <a class="email" href="mailto:{{ site.email }}">{{ site.email }}</a>
        <div class="profile-links" aria-label="Profile links">
          <a class="cv-link" href="{{ site.cv_link | relative_url }}">View CV <span class="file-type">PDF</span></a>
          <div class="social-links">
            <a href="{{ site.github_link }}">GitHub <span aria-hidden="true">↗</span></a>
            <a href="{{ site.linkedin_link }}">LinkedIn <span aria-hidden="true">↗</span></a>
          </div>
        </div>
        <nav class="section-nav" aria-label="On this page">
          <a href="#about">About</a>
          <a href="#publications">Selected Publication</a>
          <a href="#honors">Competitive Programming</a>
          <a href="#teaching">Teaching</a>
        </nav>
      </header>
      <main id="main-content">
        {{ content }}
        <footer class="site-footer">
          <p>© {{ 'now' | date: '%Y' }} {{ site.title }} · Built with Jekyll &amp; <a href="https://github.com/yaoyao-liu/minimal-light">Minimal Light</a>.</p>
        </footer>
      </main>
    </div>
  </body>
</html>
